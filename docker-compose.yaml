services:

  backend:
    build: ./backend
    container_name: customer_backend
    expose:
      - "8000"

  nginx:
    image: nginx:latest
    container_name: customer_nginx
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend